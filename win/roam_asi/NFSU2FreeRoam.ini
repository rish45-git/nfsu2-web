; NFSU2FreeRoam.asi: free-roam multiplayer for Need for Speed Underground 2
; (PC v1.2 North America) with friends on the same network, Windows or Mac.
; Put this file and NFSU2FreeRoam.asi into the game's "scripts" folder (with
; the Ultimate ASI Loader, dinput8.dll, in the game folder).  Messages go to
; scripts\NFSU2FreeRoam.log.

[FreeRoam]
; 1 = on, 0 = the plugin does nothing
Enable = 1

; the name your friends see (printable ASCII, up to 24 characters);
; empty = your game profile's name
Name =

; UDP port, the same on every machine (Mac: roam_port in settings.ini)
Port = 47210

; friends' IP addresses, if they do not show up by themselves (some routers
; and VPNs block the LAN broadcast); one is enough, the others are passed on:
; Peers = 192.168.1.20, 192.168.1.21:47210
Peers =

; 1 = find friends on the LAN by a broadcast every 2 s
Discovery = 1

; only players with the same room name see each other (empty = everybody)
Room =

; your crews, up to 4, joined by commas: players who share one see each other's
; names and map arrows in its colour, everyone else still there
; (Crew = Blue Room, Night Owls; empty = none)
Crew =

; each crew's colour in the order of Crew, 6 hex digits without '#'
; (CrewColours = 3cd2ff, ff4646; empty = cyan, magenta, violet, red)
CrewColours =

; 1 = friends' cars are solid (EXPERIMENTAL: they can shove your car);
; 0 = ghost cars you drive through
Collide = 0

; group size, you included (2..33), and friends' cars shown at once (0..5)
MaxPlayers = 33
MaxCars = 5

; write scripts\NFSU2FreeRoam.log (1) or not (0)
Log = 1

; ONLINE: play on a server's virtual LAN (the browser port's server) instead of the local network.
; Needs Windows 8 or newer.  Empty = the local network (above).  Example: Server = ws://127.0.0.1:8691/lan
; (wss://host/lan for a server with HTTPS).  The server's hub picks the players near you; Peers and Discovery
; then work with the server's virtual 10.77.x.x addresses only.
Server =

; the token of a name you claimed on the server's page (empty = an unclaimed name)
Claim =

; ONLINE MENU: with Server set, the game's own network (its Online menu, and its LAN screens) also goes to that
; server's virtual LAN: the Online menu logs in to the server's stand-in for EA's servers (any name; the password
; is not checked).  0 = the game's own network stays the real one (LAN screens on your local network).
Online = 1

; SERVER SWITCH: the servers ServerKey goes through while the game runs (from the one in use to the next, after the
; last back to the first), as name=url, joined by commas; a claimed name's token after a | (a token is one server's).
; Only with Server set at start, and only in career free roam (not in a race, a race lobby, or the LAN / Online
; menus).  The line at the top of the HUD says what happened.  The next start is on Server = again.
; Servers = local=ws://192.168.0.109:8691/lan, home=ws://127.0.0.1:8691/lan
; (a public server would be e.g. live=wss://example.org/lan; only with its owner's OK)
Servers =
ServerKey = F8

; 1 = names over the other players' cars (0 = none)
Labels = 1

; RACE LOBBIES (with Server set): race a career race with the other player.  At a race marker, the race's card asks
; Solo or Multiplayer (which button is which is in its text); Multiplayer opens a lobby there, the other player joins it
; with Enter at the marker, or from anywhere with JoinKey when the top line offers it; the host's Enter starts it, and
; both games drive themselves to the game's own LAN race and back to the marker.  Use the same private Room on both
; PCs so only the two of you are in it.
; JoinKey: join the lobby the top line offers from afar (again: leave it); 0 = none
JoinKey = J
; FarJoin: hosting, 1 = anyone in your Room may join from afar; 0 = only friends and crew-mates
FarJoin = 1
; Partner: the other player's name as it shows over their car (their profile's name, or their Name =): a friend in race
; lobbies.  Their win in a race you finished counts in your career too, where that race counts in yours (open in your
; career, your stage, not won yet); and they may join your lobby from afar and past your stage.  Set it on both PCs,
; each the other's name.  Empty = none
Partner =
; ToHost: after a race of a lobby you joined (not hosted), your car goes next to the host's car back in free roam,
; once it shows on your screen (within a minute); 0 = you stay where you were before the race
ToHost = 1

; ShowOff: friends' cars show their own open hood, trunk and doors, and yours go to them (the game keeps them per car
; model: without this a door opened on your car opened on every car of its model); 0 = off
ShowOff = 1
; Movies: after a multiplayer win, the race's movie in the garage, as after a Solo one; 0 = none
Movies = 1
; AfkBot: after this many seconds without a key press or the car's controls moving in career free roam, the game's
; own AI drives your car (its autopilot); the top of your HUD says so, the others see "[BOT]" by your name, and any
; key gives it back. 0 = never. A controller's buttons do not take it back (only the keyboard): 0 for pad players
AfkBot = 30
; CatchUp: in multiplayer races from free roam, 0 = no catch-up (the game's rubber band, which slows whoever leads, bot
; or player, and helps whoever is behind), 1 = the game's catch-up as the race's options set it
CatchUp = 0
; AiRacers: AI racers in each multiplayer (LAN) race beside the players, 0 to 4 (the grid has 6 places); each PC
; races its own, so they are not in the same places on the other PC's screen
AiRacers = 2
; AiSkill: the AI racers' skill, 0 to 9 (9 = the game's best)
AiSkill = 9
; RunInBackground: 1 = the game keeps running when its window isn't in front, so your friends keep hearing from
; you (the world still pauses until you're back); 0 = it stops, the game's own way, and the others may call you away
RunInBackground = 1
; BackgroundFps: with the game's window not in front, at most this many frames a second, so it doesn't take the
; GPU from the window you're using (0 = no cap)
BackgroundFps = 30
; AddOnStockLook: your Unlimiter add-on car (like the SENTRAB12) goes to friends with stock parts, so their games
; draw it whole (with its own parts the laptop drew it as only a name tag); 0 = send its own parts
AddOnStockLook = 1
; AddOnStockRace: 1 = in LAN races too, add-on cars go to the others' games with stock parts (to try: the laptop
; saw the SENTRAB12 as only its spoiler in races); 0 = as the game sends them
AddOnStockRace = 0
; AiEdge: the AI racers' cars are rated this many % above the best player's car (0 to 50)
AiEdge = 5
; CareerCatchUp: career races, 0 = no catch-up (the AI doesn't slow down when it leads), 1 = the game's rubber band
CareerCatchUp = 0
; TravelKey: fast travel in career free roam: to the GPS destination, or with no GPS onto the nearest race start
; (set a GPS on the world map M: Up/Down a kind, Left/Right a place, C, Yes). 0 = none
TravelKey = F7
; FriendKey: fast travel next to a friend in free roam, the next one each press. 0 = none
FriendKey = F9
; CarSaveKey, CarPutKey: copy a car the main menu shows into your career's garage. In the main menu CarSaveKey saves
; the car shown there (a profile with no career car shows one of the game's own, like the RacingHart Supra) to
; NFSU2FreeRoam.car2; then, with your profile loaded, CarPutKey puts it into the career's first free slot (a locked
; one is opened for it). Pick it in the garage, then save. Empty = off
CarSaveKey = 
CarPutKey = 
